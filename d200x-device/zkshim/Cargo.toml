[package]
name = "zkshim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Drop-in replacement for libzkgui.so: its ELF constructor execs deckd, so the stock zkgui launcher starts the Rust firmware"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
