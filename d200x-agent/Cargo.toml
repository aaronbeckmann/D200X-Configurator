[package]
name = "d200x-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PC agent for the deckd firmware: runs host actions (system, Home Assistant) and feeds states to the deck"

[dependencies]
d200x-core = { path = "../d200x-core" }
deck-config = { path = "../deck-config" }
deck-icons = { path = "../deck-icons" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2", features = ["json"] }
open = "5"
dirs = "5"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Foundation", "Win32_Security", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Power"] }
windows = { version = "0.58", features = ["Media_Control", "Foundation", "Storage_Streams", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
