[package]
name = "d200x-tool"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CLI for the Ulanzi D200/D200H/D200X vendor HID protocol and the deckd firmware"

[dependencies]
d200x-core = { path = "../d200x-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
